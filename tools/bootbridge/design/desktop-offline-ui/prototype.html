<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BootBridge 离线版 · 交互原型</title>
<style>
:root{
  --page:#E7EBEF;--bg:#F3F5F7;--panel:#FFFFFF;--soft:#F6F8F9;--ink:#1D2A33;--secondary:#53636E;--muted:#6F7D88;
  --line:#E4E9ED;--line-strong:#D4DBE0;--teal:#148A8A;--teal-ink:#0F6D6D;--teal-hover:#0F7373;--on-teal:#FFFFFF;
  --tint:#E6F4F2;--tint-line:#CFE9E5;--green:#1F7A55;--green-bg:#E9F6EE;--green-line:#CFE9DB;
  --amber:#8A6416;--amber-bg:#FDF6E7;--amber-line:#F0E2BF;--red:#B24A3F;--red-bg:#FDF1EE;--red-line:#F3D7CF;
  --shadow:0 1px 2px rgba(27,42,55,.06),0 12px 32px rgba(27,42,55,.10);--track:#E4E9ED;
}
@media (prefers-color-scheme:dark){[data-theme="auto"]{
  --page:#0A0F13;--bg:#0E1419;--panel:#161F26;--soft:#1B262E;--ink:#E7EDF0;--secondary:#A7B5BD;--muted:#8796A0;
  --line:#2A3942;--line-strong:#35454E;--teal:#4FC3BF;--teal-ink:#67D0CB;--teal-hover:#67D0CB;--on-teal:#07211F;
  --tint:#15322F;--tint-line:#1F3D3A;--green:#78D6AD;--green-bg:#15302A;--green-line:#214237;
  --amber:#F0CE83;--amber-bg:#2F2A1D;--amber-line:#43391F;--red:#F1A79C;--red-bg:#35211F;--red-line:#4A2D28;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);--track:#2A3942;
}}
[data-theme="dark"]{
  --page:#0A0F13;--bg:#0E1419;--panel:#161F26;--soft:#1B262E;--ink:#E7EDF0;--secondary:#A7B5BD;--muted:#8796A0;
  --line:#2A3942;--line-strong:#35454E;--teal:#4FC3BF;--teal-ink:#67D0CB;--teal-hover:#67D0CB;--on-teal:#07211F;
  --tint:#15322F;--tint-line:#1F3D3A;--green:#78D6AD;--green-bg:#15302A;--green-line:#214237;
  --amber:#F0CE83;--amber-bg:#2F2A1D;--amber-line:#43391F;--red:#F1A79C;--red-bg:#35211F;--red-line:#4A2D28;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);--track:#2A3942;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;padding:16px}
button{font:inherit;color:inherit}
.mono{font-family:Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;font-size:12.5px;letter-spacing:.01em}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* demo toolbar */
.demo{max-width:1040px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--secondary)}
.demo b{color:var(--ink);font-weight:600;margin-right:4px}
.demo .grp{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:3px 10px;cursor:pointer;color:var(--secondary);font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--tint);color:var(--teal-ink);font-weight:600}
.demo .note{margin-left:auto;color:var(--muted)}

/* window */
.win{width:1040px;height:700px;max-width:100%;margin:0 auto;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);box-shadow:var(--shadow)}
.titlebar{height:32px;flex:none;display:flex;align-items:center;background:var(--panel);font-size:12px;color:var(--secondary);user-select:none}
.titlebar .t{display:flex;align-items:center;gap:8px;padding-left:12px;flex:1}
.titlebar .wc{width:46px;height:32px;display:grid;place-items:center;color:var(--secondary)}
.titlebar .wc svg{width:10px;height:10px;stroke-width:1.2}
.appbar{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .name{font-size:16px;font-weight:650;letter-spacing:.01em}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--secondary)}
.appbar .right{display:flex;align-items:center;gap:8px}
.iconbtn{width:34px;height:34px;border-radius:6px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--secondary)}
.iconbtn:hover{background:var(--soft);border-color:var(--line)}
.update-pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--tint-line);background:var(--tint);color:var(--teal-ink);font-size:12.5px;font-weight:600;cursor:pointer}
.update-pill .pd{width:7px;height:7px;border-radius:50%;background:var(--teal)}

.main{flex:1;display:flex;min-height:0}
.side{width:248px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px 14px;display:flex;flex-direction:column}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.si{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;width:100%;background:transparent;text-align:left}
.si:hover{background:var(--soft)}
.si.active{background:var(--tint);border-color:var(--tint-line)}
.si .dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);flex:none;background:var(--panel)}
.si.done .dot{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.si.done .dot svg{width:14px;height:14px;stroke-width:2.6}
.si.active .dot{border-color:var(--teal);color:var(--teal-ink)}
.si .tx{display:flex;flex-direction:column;min-width:0}
.si .tx b{font-weight:600;font-size:14px;line-height:1.3}
.si .tx span{font-size:12px;color:var(--muted);line-height:1.35}
.si.active .tx b{color:var(--teal-ink)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 2px;font-size:12.5px;color:var(--secondary);display:flex;flex-direction:column;gap:4px}
.side-foot .row{display:flex;align-items:center;gap:8px}
.gd{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}

.content{flex:1;display:flex;flex-direction:column;min-width:0}
.scroll{flex:1;overflow:auto;padding:34px 48px 28px}
.eyebrow{font-size:12.5px;color:var(--muted);font-weight:500}
h1{font-size:23px;line-height:1.3;font-weight:650;margin:6px 0 10px;letter-spacing:.005em}
.lead{color:var(--secondary);margin:0 0 28px;max-width:600px;line-height:1.7}
.footer{height:64px;flex:none;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 24px}
.footer .sp{flex:1}
.footer .hint{font-size:12.5px;color:var(--muted)}

.btn{height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font-size:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal);font-weight:600}
.btn.primary:hover{background:var(--teal-hover)}
.btn.lg{height:40px;padding:0 20px;font-size:14.5px}
.btn.link{border-color:transparent;background:transparent;color:var(--teal-ink);padding:0 6px;height:28px;font-size:13px}
.btn.link:hover{background:var(--tint)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.si:focus-visible,.iconbtn:focus-visible,.mcard:focus-visible,.drop:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.card + .card,.card + .callout,.callout + .card,.callout + .callout{margin-top:16px}
.card h3{margin:0 0 14px;font-size:14px;font-weight:600}
.kv{display:grid;grid-template-columns:96px 1fr;row-gap:8px;column-gap:12px;align-items:center;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;display:flex;align-items:center;gap:6px;min-width:0}
.kv dd .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:grid;grid-template-columns:1.1fr 1.3fr 1.6fr;gap:12px}.meta div{display:flex;flex-direction:column;min-width:0}.meta span.k{font-size:12.5px;color:var(--muted)}.meta .v{display:flex;align-items:center;gap:4px;font-weight:600;min-height:28px}.meta .v .mono{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--secondary)}.ok .rmeta{border-top-color:var(--green-line)}.warn .rmeta{border-top-color:var(--amber-line)}.rmeta .sep{color:var(--muted)}
.head .grow{flex:1;min-width:0}
.divider{height:1px;background:var(--line);margin:18px 0}
.linkrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.linkrow .url{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--secondary);overflow:hidden}
.linkrow .url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mcard{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;width:100%}
.mcard:hover{border-color:var(--line-strong)}
.mcard.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;background:var(--tint)}
.mcard .ic{width:40px;height:40px;border-radius:8px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;color:var(--teal-ink);flex:none}
.mcard.sel .ic{background:var(--panel)}
.mcard .ic svg{width:20px;height:20px}
.mcard .tx{flex:1;min-width:0}
.mcard .tx b{display:block;font-size:15px;font-weight:600}
.mcard .tx b .alias{font-style:normal;font-weight:500;font-size:13px;color:var(--secondary);margin-left:8px;padding:0 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);vertical-align:2px}.mcard.sel .tx b .alias{background:var(--panel)}
.mcard .tx > span{margin-top:2px;display:block;font-size:12.5px;color:var(--secondary)}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center}
.mcard.sel .radio{border-color:var(--teal)}
.mcard.sel .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}
.fine{font-size:12.5px;color:var(--muted);margin-top:20px;display:flex;gap:6px;align-items:flex-start}
.fine svg{margin-top:2px;width:14px;height:14px}

.drop{margin-top:16px;border:1.5px dashed var(--line-strong);border-radius:10px;background:var(--panel);padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center;width:100%}
.drop:hover,.drop.over{border-color:var(--teal);background:var(--tint)}
.drop .big{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--teal-ink);display:grid;place-items:center;margin-bottom:4px}
.drop .big svg{width:22px;height:22px}
.drop b{font-size:15px;font-weight:600}
.drop span{font-size:13px;color:var(--secondary)}
.drop span u{color:var(--teal-ink);text-decoration:none;font-weight:600}
.drop small{font-size:12px;color:var(--muted);margin-top:4px}

.filerow{display:flex;align-items:center;gap:12px}
.fileic{width:38px;height:38px;border-radius:8px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;color:var(--secondary);flex:none}
.filerow .tx{flex:1;min-width:0}
.filerow .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .tx span{font-size:12.5px;color:var(--muted)}
.prog{height:6px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:18px}
.prog i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .2s linear}
.progtx{display:flex;justify-content:space-between;font-size:12.5px;color:var(--secondary);margin-top:8px}

.result{border-radius:10px;padding:20px 22px;border:1px solid}
.result.ok{background:var(--green-bg);border-color:var(--green-line)}
.result.warn{background:var(--amber-bg);border-color:var(--amber-line)}
.result.err{background:var(--red-bg);border-color:var(--red-line)}
.result .head{display:flex;gap:12px;align-items:flex-start}
.badge{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.ok .badge{background:var(--green);color:var(--panel)}
.warn .badge{background:var(--amber);color:var(--panel)}
.badge svg{width:18px;height:18px;stroke-width:2.4}
.result .head b{display:block;font-size:15.5px;font-weight:650}
.ok .head b{color:var(--green)}
.warn .head b{color:var(--amber)}
.result .head p{margin:4px 0 0;line-height:1.65;color:var(--secondary);font-size:13.5px}
.result .kv{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ok .kv{border-top-color:var(--green-line)}
.warn .kv{border-top-color:var(--amber-line)}
.result .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

.callout{display:flex;gap:10px;padding:14px 16px;line-height:1.65;border-radius:8px;border:1px solid;font-size:13.5px}
.callout svg{margin-top:2px}
.callout.amber{background:var(--amber-bg);border-color:var(--amber-line);color:var(--ink)}
.callout.amber svg{color:var(--amber)}
.callout.info{background:var(--soft);border-color:var(--line);color:var(--secondary)}
.callout.teal{background:var(--tint);border-color:var(--tint-line)}
.callout.teal svg{color:var(--teal-ink)}
.callout b{font-weight:600}

.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.olist li{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.olist li:last-child{border-bottom:0;padding-bottom:2px}
.olist li:first-child{padding-top:2px}
.olist .n{width:24px;height:24px;border-radius:50%;background:var(--soft);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--secondary);flex:none;margin-top:1px}
.olist .tx{flex:1;min-width:0}.olist .tx b{display:block;font-weight:600}
.olist .tx>span{color:var(--secondary);font-size:13.5px;line-height:1.65;display:block;margin-top:3px}
.olist .tx>.linkrow{display:flex;margin-top:12px;max-width:560px}
.olist .tx code{font-family:Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:12.5px;background:var(--soft);border:1px solid var(--line);padding:0 5px;border-radius:4px;color:var(--ink)}

.check{display:inline-flex;align-items:center;gap:10px;padding:7px 12px;color:var(--ink);font-size:13.5px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;user-select:none}
.check .box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none}
.check.on{border-color:var(--teal);background:var(--tint)}
.check.on .box{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.check .box svg{width:12px;height:12px;stroke-width:3;display:none}
.check.on .box svg{display:block}

.out{display:flex;gap:8px;align-items:center}
.out .path{flex:1;min-width:0;height:34px;display:flex;align-items:center;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel)}
.out .path span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl{font-size:12.5px;color:var(--muted);margin:20px 0 8px;font-weight:500}
.row-end{display:flex;justify-content:flex-start;align-items:center;gap:14px;margin-top:24px}
.row-end .fine{margin:0}
.soft-note{margin-top:16px;font-size:13px;color:var(--secondary);display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.soft-note svg{width:15px;height:15px;color:var(--muted)}

details.faq{margin-top:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
details.faq summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary .chev{margin-left:auto;transition:transform .15s}
details.faq[open] summary .chev{transform:rotate(90deg)}
details.faq .body{padding:0 14px 14px 38px;color:var(--secondary);font-size:13.5px}
details.faq .body ol{margin:6px 0 0;padding-left:18px}

.empty{text-align:center;padding:30px 16px}
.empty .big{width:48px;height:48px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 10px;color:var(--muted)}
.empty b{display:block;font-size:15px}
.empty p{margin:4px 0 14px;color:var(--secondary)}

/* modal */
.scrim{position:absolute;inset:0;background:rgba(10,18,24,.38);display:grid;place-items:center;z-index:5}
.winwrap{position:relative;width:1040px;max-width:100%;margin:0 auto}
.modal{width:520px;max-width:calc(100% - 32px);max-height:calc(100% - 48px);overflow:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px 20px}
.modal .mh b{font-size:16px;font-weight:650}
.modal .mb{padding:0 20px 18px}
.msec{padding:12px 0;border-top:1px solid var(--line)}
.msec:first-child{border-top:0;padding-top:4px}
.msec h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;padding:8px 0}.mrow + .mrow{border-top:1px solid var(--line)}.mrow .l b{font-weight:600;font-size:13.5px;line-height:1.4}.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mrow .l{display:flex;flex-direction:column}
.mrow .l span{font-size:12.5px;color:var(--muted)}
.toggle{width:36px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;border:0;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:left .15s}
.toggle[aria-checked="true"]{background:var(--teal)}
.toggle[aria-checked="true"]::after{left:19px}
.offline-box{font-size:13px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line-strong);border-radius:8px}
.newver{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--tint);border:1px solid var(--tint-line);margin-bottom:8px;font-size:13.5px}
.newver .sp{flex:1}

.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:center;z-index:9;box-shadow:var(--shadow)}
.toast svg{width:14px;height:14px;stroke-width:2.6}

@media (max-width:760px){
  body{padding:8px}
  .win{height:auto;min-height:640px}
  .main{flex-direction:column}
  .side{width:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .steps{flex-direction:row;overflow-x:auto;gap:4px}
  .si{width:auto;flex:none;padding:6px 8px}
  .si .tx span{display:none}
  .side-foot{display:none}
  .scroll{padding:20px 18px}
  .mgrid{grid-template-columns:1fr}
  .demo .note{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

function stepDone(n){
  if(n===1)return S.step>1;
  if(n===2)return S.file==="matched";
  if(n===3)return S.upgraded;
  if(n===4)return S.gen==="done";
  if(n===5)return S.step>5;
  return false;
}

function sidebar(){
  const L=t();
  return `<nav class="side" aria-label="steps"><ol class="steps">${L.steps.map((s,i)=>{const n=i+1,a=S.step===n,d=!a&&stepDone(n);
   return `<li><button class="si ${a?"active":""} ${d?"done":""}" data-go="${n}" aria-current="${a?"step":"false"}"><span class="dot">${d?ic("check"):n}</span><span class="tx"><b>${s[0]}</b><span>${s[1]}</span></span></button></li>`}).join("")}</ol>
   <div class="side-foot"><div class="row"><span class="gd"></span>${L.rulesOk}</div><div class="row" style="color:var(--muted);padding-left:16px">${S.ota?L.rulesLatest:L.rulesOff}</div></div></nav>`;
}

function shaRow(sha){return `<dd><span class="mono" title="${sha}">${shortSha(sha)}</span><button class="btn link" data-copy="sha">${ic("copy")}</button></dd>`}

 <div class="fine">${ic("info")}<span>${L.s1fine}</span></div>`}

function fileZone(){const L=t(),m=M();
 if(S.file==="empty")return `<button class="drop" data-act="pick" id="drop"><span class="big">${ic("upload")}</span><b>${L.dropB}</b><span>${L.dropS}</span><small>${L.dropN}</small></button>`;
 if(S.file==="hashing"||S.file==="downloading"){const dl=S.file==="downloading",p=Math.round(S.prog);
   const right=dl?`${(m.size/1048576*p/100).toFixed(1)} / ${(m.size/1048576).toFixed(1)} MB`:`${p}%`;
   return `<div class="card" style="margin-top:12px"><div class="filerow"><span class="fileic">${ic(dl?"download":"file")}</span><span class="tx"><b>${S.scenario==="bad"&&!dl?"firmware_unknown.bin":m.file}</b><span>${dl?L.downloading:L.hashing}</span></span><button class="btn" data-act="cancel">${L.cancel}</button></div><div class="prog"><i id="pbar" style="width:${p}%"></i></div><div class="progtx"><span>${dl?L.dlSrc:L.dropN}</span><span id="ptx">${right}</span></div></div>`;}
 if(S.file==="matched")return `<div class="result ok" style="margin-top:12px"><div class="head"><span class="badge">${ic("check")}</span><div class="grow"><b>${L.okTitle(mname(m),m.ver)}</b><p>${L.okSub}</p></div><button class="btn" data-act="reset-file">${L.another}</button></div>
   <div class="rmeta">${ic("file")}<span>${m.file}</span><span class="sep">·</span><span>${L.sameAs}</span></div></div>`;
 if(S.file==="bad")return `<div class="result warn" style="margin-top:12px"><div class="head"><span class="badge">${ic("alert")}</span><div class="grow"><b>${L.badTitle}</b><p>${L.badSub}</p></div></div>
   <div class="rmeta">${ic("file")}<span>firmware_unknown.bin</span><span class="sep">·</span><span>27.0 MB</span><span class="sep">·</span><span class="mono">${shortSha(BADSHA)}</span></div>
   <div class="acts"><button class="btn primary" data-act="reset-file">${L.another}</button><button class="btn" data-copy="diag">${ic("copy")}${L.copyDiag}</button></div></div>`;
 return "";}

function step2(){const L=t(),m=M();return `<div class="eyebrow">${L.stepOf(2)}</div><h1>${L.s2t}</h1><p class="lead">${L.s2l(mname(m))}</p>
 <div class="card"><h3>${L.target} · ${mname(m)}</h3><div class="meta"><div><span class="k">${L.kVer}</span><span class="v">${m.ver}</span></div><div><span class="k">${L.kSize}</span><span class="v">${(m.size/1048576).toFixed(1)} MB</span></div><div><span class="k">${L.kSha}</span><span class="v"><span class="mono" title="${m.sha}">${shortSha(m.sha)}</span><button class="btn link" data-copy="sha" aria-label="copy">${ic("copy")}</button></span></div></div>
 <div class="divider"></div>
 <div class="linkrow"><div class="url">${ic("globe")}<span class="mono">${URLS[m.id]}</span></div>
 ${S.ota?`<button class="btn primary" data-act="dl">${ic("download")}${L.directDl}</button><button class="btn" data-act="open">${ic("ext")}${L.openBrowser}</button>`:`<button class="btn primary" data-act="open">${ic("ext")}${L.openBrowser}</button><button class="btn" data-copy="link">${ic("copy")}${L.copyLink}</button>`}</div></div>
 ${fileZone()}`}

function olist(items,vars){return `<ol class="olist">${items.map((it,i)=>`<li><span class="n">${i+1}</span><span class="tx"><b>${it[0]}</b><span>${it[1].replace("{v}",`<code>${vars.v||""}</code>`).replace("{f}",`<code>${vars.f||""}</code>`).replace("192.168.10.1","<code>192.168.10.1</code>")}</span></span></li>`).join("")}</ol>`}

function step3(){const L=t(),m=M();return `<div class="eyebrow">${L.stepOf(3)}</div><h1>${L.s3t}</h1><p class="lead">${L.s3l}</p>
 <div class="callout amber">${ic("alert")}<span>${L.s3warn(m.ver)}</span></div>
 <div class="card">${olist(L.s3steps,{v:m.ver})}</div>`}

function step4(){const L=t(),m=M();let body="";
 if(S.file!=="matched"){body=`<div class="card empty"><div class="big">${ic("file")}</div><b>${L.noFileT}</b><p>${L.noFileP}</p><button class="btn primary" data-go="2">${ic("arrowL")}${L.goStep2}</button></div>`;}
 else if(S.gen==="running"){const p=Math.round(S.prog),ver=p>=80;body=`<div class="card"><div class="filerow"><span class="fileic">${ic("refresh")}</span><span class="tx"><b>${outName()}</b><span id="gstage">${ver?L.verifying:L.generating}</span></span></div><div class="prog"><i id="pbar" style="width:${p}%"></i></div><div class="progtx"><span>${L.noClose}</span><span id="ptx">${p}%</span></div></div>`;}
 else if(S.gen==="done"){body=`<div class="result ok"><div class="head"><span class="badge">${ic("check")}</span><div><b>${L.doneT}</b><p>${L.doneS}</p></div></div>
   <dl class="kv"><dt>${L.kOut}</dt><dd><span class="mono" title="${esc(outPath())}">${esc(outPath())}</span><button class="btn link" data-copy="path">${ic("copy")}</button></dd><dt>${L.kSha}</dt>${shaRow("a6c3e81f04b7d295c0e6a1b83f7d42c95e08b1a6d3f7c24e9b05a8d1c6e3f72b0")}</dl></div>
   <div class="soft-note">${ic("info")}<span>${L.noUpgrade}</span></div>`;}
 else {body=`<div class="card"><div class="filerow"><span class="fileic">${ic("file")}</span><span class="tx"><b>${m.file}</b><span>${mname(m)} · ${m.ver} · <span style="color:var(--green)">✓ ${L.verified}</span></span></span><button class="btn link" data-go="2">${L.change}</button></div>
   <div class="lbl">${L.outFile}</div><div class="out"><div class="path"><span class="mono">${esc(outPath())}</span></div><button class="btn">${L.change}</button></div></div>
   <div class="row-end"><button class="btn primary lg" data-act="gen">${L.gen}</button><div class="fine">${ic("shield")}<span>${L.genFine}</span></div></div>`;}
 return `<div class="eyebrow">${L.stepOf(4)}</div><h1>${L.s4t}</h1><p class="lead">${L.s4l}</p>${body}`}

function step5(){const L=t();return `<div class="eyebrow">${L.stepOf(5)}</div><h1>${L.s5t}</h1><p class="lead">${L.s5l}</p>
 <div class="card">${olist(L.s5steps,{f:outName()})}</div><div class="callout info">${ic("info")}<span>${L.s5info}</span></div>`}

function step6(){const L=t(),m=M();return `<div class="eyebrow">${L.stepOf(6)}</div><h1>${L.s6t}</h1><p class="lead">${L.s6l}</p>
 <div class="callout teal">${ic("shield")}<span>${L.s6backup}</span></div>
 <div class="card">${olist(L.s6steps,{}).replace("</span></span></li>",`</span><span class="linkrow"><span class="url">${ic("link")}<span class="mono">http://192.168.10.1/</span></span><button class="btn primary" data-act="open">${ic("ext")}${L.openBrowser}</button><button class="btn" data-copy="maint" aria-label="copy">${ic("copy")}</button></span></span></li>`)}</div>
 <details class="faq"><summary>${ic("alert")}<span>${L.faqQ}</span>${ic("chev","i chev")}</summary><div class="body">${L.faqA(m.ver)}<ol>${L.faqSteps.map(s=>`<li>${s}</li>`).join("")}</ol></div></details>
 <div class="soft-note">${ic("info")}<span>${L.noUpgrade}</span></div>`}

function footer(){const L=t();let nextDis=false,hint="";
 if(S.step===3){nextDis=!S.upgraded;hint=`<span class="check ${S.upgraded?"on":""}" role="checkbox" tabindex="0" aria-checked="${S.upgraded}" data-act="toggle-up"><span class="box">${ic("check")}</span><span>${L.s3check(M().ver)}</span></span>`;}
 if(S.step===4&&S.gen==="running")nextDis=true;
 const last=S.step===6;
 return `<div class="footer"><span class="hint">${hint}</span><span class="sp"></span>${S.step>1?`<button class="btn" data-act="prev">${ic("arrowL")}${L.prev}</button>`:""}<button class="btn ${S.step===4&&S.gen!=="done"?"":"primary"}" data-act="next" ${nextDis?"disabled":""}>${last?L.finish:L.next}${last?"":ic("arrowR")}</button></div>`}

function modal(){if(!S.modal)return "";const L=t();
 const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-set="${k}" data-val="${v}" aria-pressed="${S[k]===v}">${l}</button>`).join("")}</div>`;
 const upd=S.ota?`<div class="newver">${ic("download")}<b>${L.newVer}</b><span class="sp"></span><button class="btn link">${L.viewNotes}</button><button class="btn primary">${L.updNow}</button></div>
   <div class="mrow"><div class="l"><b>${L.uTool}</b><span>0.3.0</span></div><button class="btn">${ic("refresh")}${L.check}</button></div>
   <div class="mrow"><div class="l"><b>${L.uRules}</b><span>R6 · ${L.latest}</span></div></div>
   <div class="mrow"><div class="l"><b>${L.uFw}</b><span>${L.uFwS}</span></div></div>
   <div class="mrow"><div class="l"><b>${L.uAuto}</b><span>${L.uAutoS}</span></div><button class="toggle" role="switch" aria-checked="${S.autoChk}" data-act="auto"></button></div>`
   :`<div class="offline-box">${L.offlineUpd}</div>`;
 return `<div class="scrim" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${L.settings}" data-stop="1">
  <div class="mh"><b>${L.settings}</b><button class="iconbtn" data-act="close-modal">${ic("x")}</button></div><div class="mb">
  <div class="msec mgrid2"><div><h4>${L.mLang}</h4>${seg("lang",[["zh","中文"],["en","English"]])}</div><div><h4>${L.mTheme}</h4>${seg("theme",[["auto",L.themeAuto],["light",L.themeLight],["dark",L.themeDark]])}</div></div>
  <div class="msec"><h4>${L.mUpdate}</h4>${upd}</div>
  <div class="msec"><h4>${L.mDiag}</h4><div class="mrow"><div class="l"><span>${L.diagS}</span></div><button class="btn" data-copy="diag">${ic("copy")}${L.copyDiag}</button></div></div>
  <div class="msec"><h4>${L.mAbout}</h4><div style="font-size:13px;color:var(--secondary);white-space:pre-line">${L.about}</div></div>
 </div></div></div>`}

function render(){
 const L=t();const root=document.getElementById("root");document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.lang==="zh"?"zh-CN":"en";
 const content=[null,step1,step2,step3,step4,step5,step6][S.step]();
 const sc=document.querySelector(".scroll");const keep=sc&&sc.dataset.step==S.step?sc.scrollTop:0;
 root.innerHTML=`
 <div class="demo"><span><b>交互原型</b></span>
  <span class="grp">主题 <span class="seg"><button data-set="theme" data-val="auto" aria-pressed="${S.theme==="auto"}">自动</button><button data-set="theme" data-val="light" aria-pressed="${S.theme==="light"}">浅色</button><button data-set="theme" data-val="dark" aria-pressed="${S.theme==="dark"}">深色</button></span></span>
  <span class="grp">OTA 预留 <span class="seg"><button data-set="ota" data-val="0" aria-pressed="${!S.ota}">隐藏</button><button data-set="ota" data-val="1" aria-pressed="${S.ota}">显示</button></span></span>
  <span class="grp">拖入的文件 <span class="seg"><button data-set="scenario" data-val="good" aria-pressed="${S.scenario==="good"}">正确</button><button data-set="scenario" data-val="bad" aria-pressed="${S.scenario==="bad"}">不支持</button></span></span>
  <button class="btn link" data-act="reset-all">重置</button>
  <span class="note">机型版本、链接和哈希均为示意数据</span></div>
 <div class="winwrap"><div class="win">
  <div class="titlebar"><div class="t">${LOGO.replace('width="26" height="26"','width="16" height="16"')}<span>BootBridge</span></div><span class="wc">${ic("min")}</span><span class="wc">${ic("max")}</span><span class="wc">${ic("close")}</span></div>
  <header class="appbar"><div class="brand">${LOGO}<span class="name">${L.title}</span><span class="tag">${L.edition}</span></div>
   <div class="right">${S.ota?`<button class="update-pill" data-act="open-modal"><span class="pd"></span>${L.update}</button>`:""}
   <div class="seg" role="group" aria-label="language"><button data-set="lang" data-val="zh" aria-pressed="${S.lang==="zh"}">中文</button><button data-set="lang" data-val="en" aria-pressed="${S.lang==="en"}">EN</button></div>
   <button class="iconbtn" data-act="open-modal" title="${L.settings}" aria-label="${L.settings}">${ic("gear")}</button></div></header>
  <div class="main">${sidebar()}<section class="content"><div class="scroll" data-step="${S.step}">${content}</div>${footer()}</section></div>
 </div>${modal()}${S.toast?`<div class="toast">${ic("check")}${esc(S.toast)}</div>`:""}</div>`;
 const nsc=document.querySelector(".scroll");if(nsc)nsc.scrollTop=keep;
 const d=document.getElementById("drop");if(d){d.ondragover=e=>{e.preventDefault();d.classList.add("over")};d.ondragleave=()=>d.classList.remove("over");d.ondrop=e=>{e.preventDefault();startHash()}}
}

let timer=null;
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function runProgress(speed,onDone){stopTimer();S.prog=0;render();timer=setInterval(()=>{S.prog=Math.min(100,S.prog+speed*(0.6+Math.random()*0.8));
  const b=document.getElementById("pbar"),tx=document.getElementById("ptx");
  if(S.file==="downloading"&&tx){const m=M();tx.textContent=`${(m.size/1048576*S.prog/100).toFixed(1)} / ${(m.size/1048576).toFixed(1)} MB`}else if(tx)tx.textContent=Math.round(S.prog)+"%";
  if(b)b.style.width=S.prog+"%";
  const g=document.getElementById("gstage");if(g)g.textContent=S.prog>=80?t().verifying:t().generating;
  if(S.prog>=100){stopTimer();onDone();render();}},120)}
function startHash(){S.file="hashing";runProgress(7,()=>{S.file=S.scenario==="bad"?"bad":"matched"})}
function toast(msg){S.toast=msg;render();clearTimeout(toast._t);toast._t=setTimeout(()=>{S.toast="";render()},1400)}

document.addEventListener("click",e=>{
 const el=e.target.closest("[data-go],[data-act],[data-set],[data-model],[data-copy]");
 if(!el){return}
 if(el.dataset.act==="close-modal"&&e.target.closest("[data-stop]")&&!e.target.closest(".iconbtn"))return;
 if(el.dataset.go){S.step=+el.dataset.go;render();return}
 if(el.dataset.model){S.model=el.dataset.model;if(S.file!=="empty"){S.file="empty";S.gen="idle"}render();return}
 if(el.dataset.copy){toast(t().copied);return}
 if(el.dataset.set){const k=el.dataset.set,v=el.dataset.val;S[k]=k==="ota"?v==="1":v;render();return}
 const a=el.dataset.act;
 if(a==="next"){if(S.step<6){S.step++;}render();}
 else if(a==="prev"){if(S.step>1)S.step--;render();}
 else if(a==="pick")startHash();
 else if(a==="dl"){S.file="downloading";runProgress(5,()=>{S.file="matched"})}
 else if(a==="cancel"){stopTimer();S.file="empty";render();}
 else if(a==="reset-file"){S.file="empty";S.gen="idle";render();}
 else if(a==="toggle-up"){S.upgraded=!S.upgraded;render();}
 else if(a==="gen"){S.gen="running";runProgress(6,()=>{S.gen="done"})}
 else if(a==="open"){toast(t().opened)}
 else if(a==="open-modal"){S.modal=true;render();}
 else if(a==="close-modal"){S.modal=false;render();}
 else if(a==="auto"){S.autoChk=!S.autoChk;render();}
 else if(a==="reset-all"){stopTimer();Object.assign(S,{step:1,model:"NX30",file:"empty",gen:"idle",upgraded:false,modal:false,prog:0});render();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal){S.modal=false;render()}
 if((e.key===" "||e.key==="Enter")&&e.target.dataset&&e.target.dataset.act==="toggle-up"){e.preventDefault();S.upgraded=!S.upgraded;render()}});
render();
</script>
</body>
</html>
